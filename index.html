  <body data-state="title" class="bg-[#0b0d12] text-[#f8fafc] overflow-hidden select-none">
    <div id="root"></div>
    <div id="klasik-error-guard" role="alert"></div>
    <script>
      (function () {
        function showErr(msg) {
          var el = document.getElementById('klasik-error-guard');
          if (!el) return;
          el.style.display = 'block';
          el.textContent = '⚠️ RUNTIME GUARD: ' + String(msg || 'Unexpected error');
        }
        window.addEventListener('error', function (e) {
          if (e && e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'LINK')) return;
          showErr(e && e.message ? e.message : 'Script error');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
          if (reason && reason.indexOf('ServiceWorker') !== -1) return;
          if (reason) showErr(reason);
        });
      })();
    </script>
